name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Ensure default_web_client_id exists
        run: |
          mkdir -p app/src/main/res/values
          FILE="app/src/main/res/values/strings.xml"
          if [ ! -f "$FILE" ]; then
            printf '<resources>\n    <string name="default_web_client_id" translatable="false">placeholder-client-id</string>\n</resources>\n' > "$FILE"
          elif ! grep -q "default_web_client_id" "$FILE"; then
            sed -i 's|</resources>|    <string name="default_web_client_id" translatable="false">placeholder-client-id</string>\n</resources>|' "$FILE"
          fi
      - name: Generate debug keystore
        run: |
          PASS=$(grep -oE 'storePassword[[:space:]=]+["'\''][^"'\'']+["'\'']' app/build.gradle* 2>/dev/null | head -n1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' || true)
          ALIAS=$(grep -oE 'keyAlias[[:space:]=]+["'\''][^"'\'']+["'\'']' app/build.gradle* 2>/dev/null | head -n1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' || true)
          KPASS=$(grep -oE 'keyPassword[[:space:]=]+["'\''][^"'\'']+["'\'']' app/build.gradle* 2>/dev/null | head -n1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' || true)
          PASS=${PASS:-android}
          ALIAS=${ALIAS:-androiddebugkey}
          KPASS=${KPASS:-$PASS}
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass "$PASS" -alias "$ALIAS" -keypass "$KPASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
